html { scroll-behavior: smooth; }
body {

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

.hero::before {

  height: 420px;
  background:

}
.logo {

}
.brand h1 {

}
.brand p { color: var(--muted); font-size: .85rem; margin-top: 2px; }
.hero-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.icon-btn {

  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--card);
  display: grid; place-items: center;
  font-size: 1.05rem;
  transition: .15s;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.search-wrap {

  z-index: 2;
}
.search-box {

  align-items: center;

  border: 1px solid var(--line);
  border-radius: 14px;

.search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56,189,248,.15); }

  font-size: 1rem;
  outline: none;
  font-family: inherit;

.search-box input::placeholder { color: var(--muted); }
.kbd {

  font-size: .68rem;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 2px 6px;
}
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 16px;
  position: relative;
  z-index: 2;
}
.chip {
  padding: 7px 14px;
  border-radius: 999px;
  font-size: .78rem;
  font-weight: 600;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--muted);
  transition: .15s;

.chip:hover { color: var(--text); border-color: var(--accent); }

  border-color: rgba(56,189,248,.4);
  color: var(--accent);

.stats {

  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin: 22px 0 8px;
}

.stat {

}
.grid {

}

.card-top {

.card-actions {

.btn {

.empty {

  try {
    const t = localStorage.getItem('hub_theme');
    if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  } catch(e) {}
})();
function matchItem(item) {
  if (activeFilter !== 'all' && !(item.cat || []).includes(activeFilter)) return false;
  if (!query) return true;
  const hay = [item.title, item.desc, ...(item.tags||[]), item.path||''].join(' ').toLowerCase();
  return query.split(/\s+/).every(w => hay.includes(w));
}
function renderFilters() {
  document.getElementById('filters').innerHTML = FILTERS.map(f =>
    `<button type="button" class="chip ${activeFilter===f.id?'active':''}" data-f="${f.id}">${f.label}</button>`
  ).join('');
  document.querySelectorAll('.chip').forEach(btn => {
    btn.onclick = () => { activeFilter = btn.dataset.f; render(); };
  });
}
function cardHTML(item) {
  const badge = item.badge || { t: 'Материал', c: '' };
  const actions = [];
  if (item.url) actions.push(`<a class="btn" href="${item.url}" target="_blank" rel="noopener">Открыть ↗</a>`);
  if (item.path && !item.url) actions.push(`<span class="btn ghost" title="Откройте файл из artifacts">Локальный файл</span>`);
  if (item.path && item.url) actions.push(`<span class="btn ghost" title="${item.path}">путь</span>`);
  return `<article class="card">
    <div class="card-top"><span class="badge ${badge.c||''}">${badge.t}</span></div>
    <h3>${item.title}</h3>
    <p>${item.desc||''}</p>
    <div class="tags">${(item.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    ${item.path ? `<div class="path">${item.path}</div>` : ''}
    <div class="card-actions">${actions.join('')}</div>
  </article>`;
}
function render() {
  renderFilters();
  let total = 0, online = 0, cards = 0, shown = 0;
  const topics = new Set();
  const html = SECTIONS.map(sec => {
    const items = sec.items.filter(matchItem);
    sec.items.forEach(it => {
      total++;
      if (it.url) online++;
      if ((it.cat||[]).includes('students')) cards++;
      (it.cat||[]).forEach(c => topics.add(c));
    });
    if (!items.length) return '';
    shown += items.length;
    return `<section class="section" data-sec="${sec.id}">
      <div class="section-head">
        <h2><span class="dot" style="background:${sec.color}"></span>${sec.title}</h2>
        <span class="count">${items.length}</span>
      </div>
      <div class="grid">${items.map(cardHTML).join('')}</div>
    </section>`;
  }).join('');
  document.getElementById('content').innerHTML = html;
  document.getElementById('empty').classList.toggle('show', shown === 0);
  document.getElementById('statAll').textContent = total;
  document.getElementById('statOnline').textContent = online;
  document.getElementById('statCards').textContent = cards;
  document.getElementById('statTopics').textContent = topics.size;
}
const q = document.getElementById('q');
q.addEventListener('input', () => { query = q.value.trim().toLowerCase(); render(); });
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
});
render();
</script>
</body>
</html>
