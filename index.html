<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="Каталог учебных материалов — интерактивы, карточки учеников, грамматика, предлоги">
<title>Materials Hub · English Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b1220;
  --bg2: #111a2e;
  --card: #151f33;
  --card2: #1a2540;
  --line: rgba(148,163,184,.14);
  --text: #e8eef8;
  --muted: #8b9bb8;
  --accent: #38bdf8;
  --accent2: #818cf8;
  --green: #34d399;
  --amber: #fbbf24;
  --rose: #fb7185;
  --violet: #a78bfa;
  --radius: 16px;
  --shadow: 0 8px 30px rgba(0,0,0,.35);
}
[data-theme="light"] {
  --bg: #f4f7fb;
  --bg2: #ffffff;
  --card: #ffffff;
  --card2: #f8fafc;
  --line: rgba(15,23,42,.08);
  --text: #0f172a;
  --muted: #64748b;
  --accent: #0284c7;
  --accent2: #4f46e5;
  --shadow: 0 8px 24px rgba(15,23,42,.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: "DM Sans", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 18px 80px; }
.hero {
  position: relative;
  padding: 36px 0 28px;
  overflow: hidden;
}
.hero::before {
  content: "";
  position: absolute;
  inset: -40% -20% auto;
  height: 420px;
  background:
    radial-gradient(ellipse 50% 60% at 20% 40%, rgba(56,189,248,.18), transparent 60%),
    radial-gradient(ellipse 40% 50% at 80% 20%, rgba(129,140,248,.16), transparent 55%),
    radial-gradient(ellipse 30% 40% at 60% 80%, rgba(167,139,250,.1), transparent 50%);
  pointer-events: none;
}
.hero-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  position: relative;
}
.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}
.logo {
  width: 48px; height: 48px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: grid; place-items: center;
  font-weight: 700; font-size: 1.15rem; color: #fff;
  box-shadow: 0 8px 24px rgba(56,189,248,.25);
}
.brand h1 {
  font-size: 1.35rem;
  font-weight: 700;
  letter-spacing: -.02em;
}
.brand p { color: var(--muted); font-size: .85rem; margin-top: 2px; }
.hero-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.icon-btn {
  width: 40px; height: 40px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--card);
  display: grid; place-items: center;
  font-size: 1.05rem;
  transition: .15s;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.search-wrap {
  margin-top: 22px;
  position: relative;
  z-index: 2;
}
.search-box {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 16px;
  box-shadow: var(--shadow);
}
.search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56,189,248,.15); }
.search-box svg { opacity: .55; flex-shrink: 0; }
.search-box input {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--text);
  font-size: 1rem;
  outline: none;
  font-family: inherit;
}
.search-box input::placeholder { color: var(--muted); }
.kbd {
  font-family: "JetBrains Mono", monospace;
  font-size: .68rem;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 2px 6px;
}
.filters-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  margin-top: 16px;
  position: relative;
  z-index: 5;
}
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  flex: 1;
  min-width: 0;
}
.chip {
  padding: 7px 14px;
  border-radius: 999px;
  font-size: .78rem;
  font-weight: 600;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--muted);
  transition: .15s;
  white-space: nowrap;
}
.chip:hover { color: var(--text); border-color: var(--accent); }
.chip.active {
  background: linear-gradient(135deg, rgba(56,189,248,.18), rgba(129,140,248,.18));
  border-color: rgba(56,189,248,.4);
  color: var(--accent);
}
.student-filter {
  position: relative;
  flex-shrink: 0;
}
.student-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px;
  border-radius: 999px;
  font-size: .78rem;
  font-weight: 600;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--muted);
  transition: .15s;
  white-space: nowrap;
}
.student-btn:hover,
.student-btn.open {
  color: var(--text);
  border-color: var(--accent);
}
.student-btn.has-value {
  background: linear-gradient(135deg, rgba(167,139,250,.15), rgba(129,140,248,.12));
  border-color: rgba(167,139,250,.4);
  color: var(--violet);
}
.student-btn .chev {
  font-size: .65rem;
  opacity: .7;
  transition: transform .15s;
}
.student-btn.open .chev { transform: rotate(180deg); }
.student-menu {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  min-width: 180px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 6px;
  display: none;
  z-index: 20;
}
.student-menu.open { display: block; }
.student-option {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 9px 12px;
  border-radius: 10px;
  font-size: .82rem;
  font-weight: 500;
  color: var(--muted);
  text-align: left;
  transition: .12s;
}
.student-option:hover { background: var(--card2); color: var(--text); }
.student-option.active {
  background: rgba(167,139,250,.12);
  color: var(--violet);
  font-weight: 600;
}
.student-option .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: currentColor;
  opacity: .5;
  flex-shrink: 0;
}
.student-option.active .dot { opacity: 1; }
.filters-divider {
  width: 1px;
  height: 22px;
  background: var(--line);
  flex-shrink: 0;
}
@media (max-width: 640px) {
  .filters-bar { flex-direction: column; align-items: stretch; }
  .student-filter { align-self: flex-start; }
  .filters-divider { display: none; }
}
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin: 22px 0 8px;
}
@media (max-width: 640px) { .stats { grid-template-columns: repeat(2, 1fr); } }
.stat {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 16px;
}
.stat b { display: block; font-size: 1.35rem; font-weight: 700; letter-spacing: -.02em; }
.stat span { font-size: .75rem; color: var(--muted); }
.section { margin-top: 32px; }
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.section-head h2 {
  font-size: 1.05rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-head h2 .dot {
  width: 10px; height: 10px; border-radius: 50%;
}
.section-head .count {
  font-size: .75rem;
  color: var(--muted);
  font-weight: 500;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: .18s transform, .18s border-color, .18s box-shadow;
  position: relative;
  overflow: hidden;
}
.card:hover {
  transform: translateY(-2px);
  border-color: rgba(56,189,248,.35);
  box-shadow: var(--shadow);
}
.card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}
.badge {
  font-size: .65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .04em;
  padding: 3px 8px;
  border-radius: 6px;
  background: rgba(56,189,248,.12);
  color: var(--accent);
}
.badge.green { background: rgba(52,211,153,.12); color: var(--green); }
.badge.amber { background: rgba(251,191,36,.12); color: var(--amber); }
.badge.rose { background: rgba(251,113,133,.12); color: var(--rose); }
.badge.violet { background: rgba(167,139,250,.12); color: var(--violet); }
.badge.muted { background: rgba(148,163,184,.12); color: var(--muted); }
.card h3 {
  font-size: .95rem;
  font-weight: 650;
  letter-spacing: -.01em;
  line-height: 1.3;
}
.card p {
  font-size: .8rem;
  color: var(--muted);
  flex: 1;
}
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag {
  font-size: .68rem;
  color: var(--muted);
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 2px 7px;
}
.card-actions {
  display: flex;
  gap: 8px;
  margin-top: 4px;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  border-radius: 10px;
  font-size: .78rem;
  font-weight: 600;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  transition: .15s opacity;
}
.btn:hover { opacity: .9; }
.btn.ghost {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--text);
}
.btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
.path {
  font-family: "JetBrains Mono", monospace;
  font-size: .65rem;
  color: var(--muted);
  opacity: .8;
  word-break: break-all;
}
.empty {
  text-align: center;
  padding: 48px 16px;
  color: var(--muted);
  display: none;
}
.empty.show { display: block; }
footer {
  margin-top: 48px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: .78rem;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.hidden-section { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-top">
      <div class="brand">
        <div class="logo">EH</div>
        <div>
          <h1>Materials Hub</h1>
          <p>Все материалы для уроков английского — в одном месте</p>
        </div>
      </div>
      <div class="hero-actions">
        <button class="icon-btn" type="button" onclick="toggleTheme()" title="Тема">🌓</button>
      </div>
    </div>

    <div class="search-wrap">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
        <input id="q" type="search" placeholder="Поиск: артикли, предлоги, Егор, Simple Tenses…" autocomplete="off">
        <span class="kbd">/</span>
      </div>
    </div>

    <div class="filters-bar">
      <div class="filters" id="filters"></div>
      <div class="filters-divider" aria-hidden="true"></div>
      <div class="student-filter" id="studentFilter">
        <button type="button" class="student-btn" id="studentBtn" aria-haspopup="listbox" aria-expanded="false">
          <span id="studentLabel">Все ученики</span>
          <span class="chev">▾</span>
        </button>
        <div class="student-menu" id="studentMenu" role="listbox"></div>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><b id="statAll">0</b><span>Всего материалов</span></div>
      <div class="stat"><b id="statOnline">0</b><span>Онлайн-ссылки</span></div>
      <div class="stat"><b id="statCards">0</b><span>Карточки учеников</span></div>
      <div class="stat"><b id="statTopics">0</b><span>Темы</span></div>
    </div>
  </header>

  <div id="content"></div>
  <div class="empty" id="empty">Ничего не найдено. Попробуйте другой запрос.</div>

  <footer>
    <span>English Tutor · Materials Hub</span>
    <span>Обновлено: ноябрь 2026</span>
  </footer>
</div>

</script>
</body>
</html>
